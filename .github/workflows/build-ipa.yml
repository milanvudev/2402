
name: CleanerVar iOS IPA Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build CleanerVar for iOS 27
    runs-on: macos-26

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          xcodebuild -showsdks

      - name: Verify project
        run: |
          test -d CleanerVar.xcodeproj
          xcodebuild -list -project CleanerVar.xcodeproj

      - name: Build unsigned application
        run: |
          xcodebuild \
            -project CleanerVar.xcodeproj \
            -scheme CleanerVar \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            IPHONEOS_DEPLOYMENT_TARGET=27.0 \
            build

      - name: Package IPA
        run: |
          APP=$(find build/DerivedData/Build/Products \
            -type d -name "*.app" | head -n 1)

          test -n "$APP"

          mkdir -p Payload
          cp -R "$APP" Payload/

          zip -qr CleanerVar-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: CleanerVar-iOS-27-IPA
          path: CleanerVar-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: CleanerVar-unsigned.ipa
          generate_release_notes: true
